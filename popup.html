<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Honour reduce-motion preference. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      /* Exception: the brief channel-item add/duplicate fade is informational
         (not decorative motion) and isn't vestibularly triggering, so we keep
         the transition even when reduce-motion is on. */
      .channel-item { transition-duration: 0.45s !important; }
    }

    /* Visible keyboard-focus ring (only for keyboard nav, not clicks). */
    button:focus, input:focus, a:focus { outline: none; }
    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid #bf94ff;
      outline-offset: 2px;
      border-radius: 3px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      background: #0e0e10;
      color: #efeff1;
      padding: 14px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #efeff1;
    }

    h1 span.sub {
      font-weight: 400;
      font-size: 11px;
      color: #adadb8;
    }

    .section { margin-bottom: 16px; }

    .section-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .twitch-color { color: #bf94ff; }
    .kick-color   { color: #53fc18; }

    .add-row {
      display: flex;
      gap: 5px;
      margin-bottom: 7px;
    }

    input[type="text"] {
      flex: 1;
      background: #1f1f23;
      border: 1px solid #3a3a3d;
      color: #efeff1;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    input[type="text"]::placeholder { color: #5a5a60; }
    input[type="text"]:focus { outline: none; border-color: #bf94ff; }

    .btn-add {
      background: #bf94ff;
      color: #0e0e10;
      border: none;
      padding: 6px 11px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }
    .btn-add:hover { background: #a970ff; }
    .btn-add.kick-add { background: #53fc18; }
    .btn-add.kick-add:hover { background: #3ee010; }

    .channel-list { display: flex; flex-direction: column; gap: 3px; }

    .channel-item {
      display: flex;
      align-items: center;
      background: #1f1f23;
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 12px;
      gap: 6px;
      box-shadow: 0 0 0 0 transparent;
      transition: background 0.45s ease-out, box-shadow 0.45s ease-out;
    }

    /* Confirmation flash on add (green) / duplicate-already-exists (purple).
       Soft colour, ~1.0s hold, then a clearly-visible 0.5s ease-out fade
       back to the default. Total visible time: ~1.5s. Class-state (not
       @keyframes) so timing is reliable even with prefers-reduced-motion. */
    .channel-item.flash-added {
      background: rgba(83, 252, 24, 0.13);
      box-shadow: 0 0 0 1px rgba(83, 252, 24, 0.65), 0 0 10px rgba(83, 252, 24, 0.4);
      transition: none;   /* snap in — only the OUT phase animates */
    }
    .channel-item.flash-duplicate {
      background: rgba(191, 148, 255, 0.13);
      box-shadow: 0 0 0 1px rgba(191, 148, 255, 0.65), 0 0 10px rgba(191, 148, 255, 0.4);
      transition: none;
    }

    .channel-item a {
      flex: 1;
      color: #efeff1;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .channel-item a:hover { color: #bf94ff; }

    .btn-remove {
      background: none;
      border: none;
      color: #5a5a60;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #eb0400; }

    .btn-bell {
      background: none;
      border: none;
      color: #5a5a60;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .btn-bell:hover  { color: #efeff1; }
    .btn-bell.muted  { color: #5a5a60; }
    .btn-bell.active { color: #bf94ff; }

    .notif-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #adadb8;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: none;
    }
    .notif-row input { cursor: pointer; }
    .notif-row.disabled { opacity: 0.5; }

    .empty {
      color: #5a5a60;
      font-size: 11px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .empty .empty-line  { font-style: italic; }
    .empty .empty-hint  { font-style: normal; color: #6f6f78; font-size: 10px; margin-top: 1px; }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2e;
      margin: 14px 0;
    }

    .donate-wrap {
      text-align: center;
      margin-bottom: 10px;
    }

    .donate-btn {
      display: inline-block;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ff5e5b;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.15s;
    }
    .donate-btn:hover { background: #e04a47; }

    .footer {
      font-size: 10px;
      color: #7c7c85;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>👻 <span data-i18n="popupTitle">GhostViewer</span> <span class="sub" data-i18n="popupSubtitle">channel list</span></h1>

  <!-- Twitch section -->
  <div class="section">
    <div class="section-header twitch-color">
      <span>Twitch</span>
    </div>
    <div class="add-row">
      <input id="twitch-input" type="text" data-i18n-placeholder="popupAddPlaceholder" placeholder="channel name or URL" autocomplete="off" spellcheck="false" />
      <button class="btn-add" data-platform="twitch" data-i18n-aria-label="popupAddChannel" aria-label="Add channel">+</button>
    </div>
    <div class="channel-list" id="twitch-list"></div>
  </div>

  <hr class="divider">

  <!-- Kick section -->
  <div class="section">
    <div class="section-header kick-color">
      <span>Kick</span>
    </div>
    <div class="add-row">
      <input id="kick-input" type="text" data-i18n-placeholder="popupAddPlaceholder" placeholder="channel name or URL" autocomplete="off" spellcheck="false" />
      <button class="btn-add kick-add" data-platform="kick" data-i18n-aria-label="popupAddChannel" aria-label="Add channel">+</button>
    </div>
    <div class="channel-list" id="kick-list"></div>
  </div>

  <hr class="divider">

  <label class="notif-row" for="notif-toggle">
    <input type="checkbox" id="notif-toggle">
    <span data-i18n="popupNotifyToggle">Notify me when a ghosted streamer goes live</span>
  </label>

  <div class="donate-wrap">
    <a class="donate-btn" href="https://ko-fi.com/ghostydev" target="_blank" rel="noopener noreferrer" data-i18n="popupDonate">
      ☕ Buy me a coffee
    </a>
  </div>

  <p class="footer" data-i18n="popupFooter">Only listed channels are affected. All other streams load normally.</p>

  <script src="i18n.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
